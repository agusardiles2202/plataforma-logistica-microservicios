server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:tp_backend_db}
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USER:tp_user}
    password: ${POSTGRES_PASSWORD:tp_pass}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

# Logging Configuration
logging:
  level:
    root: INFO
    tp.backend.ms_tarifa: INFO
    tp.backend.ms_tarifa.controller: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
