server:
  port: 8083

spring:
  datasource:
    # Añadimos options=-c TimeZone=UTC codificado para forzar al servidor a usar UTC
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${POSTGRES_DB:tp_backend_db}?options=-c%20TimeZone%3DUTC
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USER:tp_user}
    password: ${POSTGRES_PASSWORD:tp_pass}
  jpa:
    hibernate:
      ddl-auto: none     # usamos schema.sql
      # Evita problemas de timezone al mapear timestamps desde JDBC
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  sql:
    init:
      mode: never       # inicialización la hace Docker

# H2 console removed (using Docker/Postgres)

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

# Logging Configuration
logging:
  level:
    root: INFO
    tp.backend.ms_contenedor: INFO
    tp.backend.ms_contenedor.controller: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"